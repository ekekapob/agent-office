<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Adventurers' Guild · Mockup B · Fantasy Guild Hall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --stone:#1a1510;--stone2:#241d15;--stone3:#2f261c;--wood:#5a3b1e;--wood2:#3e2812;--wood3:#8a5a2b;
  --parch:#efe0bd;--parch2:#e3d0a3;--ink:#3a2a14;--ink2:#6b5231;--gold:#e0b354;--ember:#ff8c3a;--magic:#7fd4ff;--blood:#5a1414;
  --work:#6fd26f;--think:#7fb7ff;--wait:#ffb347;--idle:#a89f8f;--done:#c7a3ff;
  --title:'Pirata One',Georgia,serif;--fell:'IM Fell English',Georgia,serif;--ui:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{color:#f4e6c8;font-family:var(--fell);font-size:14px;display:flex;flex-direction:column;min-height:100vh;
 background:repeating-linear-gradient(0deg,#00000040 0 2px,transparent 2px 40px),repeating-linear-gradient(90deg,#00000040 0 2px,transparent 2px 84px),var(--stone2)}
button{font:inherit}
.muted{color:#b9a98a}.small{font-size:11.5px}.grow{flex:1;min-width:0}

/* ---------- top beam ---------- */
.topbar{display:flex;align-items:center;gap:16px;padding:8px 18px;background:linear-gradient(#6b4623,#4a2f16);border-bottom:4px solid #2a1808;box-shadow:0 4px 0 #0008;flex-wrap:wrap}
.brand{font-family:var(--title);font-size:26px;color:var(--gold);text-shadow:2px 2px 0 #000;display:flex;align-items:center;gap:10px;white-space:nowrap}
.brand .sub{font-family:var(--fell);font-size:12px;color:#e8d7b3aa;text-shadow:none}
.views{display:flex;gap:8px;flex-wrap:wrap}
.views button{font-family:var(--fell);font-size:14px;padding:6px 12px;border:2px solid #2a1808;border-radius:3px;background:linear-gradient(#8a5a2b,#6a4220);color:#f4e6c8;cursor:pointer;display:flex;align-items:center;gap:8px;box-shadow:0 3px 0 #0006}
.views button.on{background:linear-gradient(#e0b354,#c98f45);color:#2a1808;font-weight:700}
.views small{font-size:12px;opacity:.85}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:0 0 auto}
.dot.busy{background:var(--work)}.dot.waiting{background:var(--wait)}.dot.idle{background:var(--idle)}
.stats{margin-left:auto;display:flex;gap:16px;font-size:14px;color:#e8d7b3;align-items:center}
.stats b{color:var(--gold)}.stats .warn b{color:var(--wait)}
.stats .clock{font-variant-numeric:tabular-nums;padding-left:12px;border-left:1px solid #0006}
.ribbon{font-family:var(--title);font-size:11px;color:#2a1808;background:var(--wait);padding:3px 8px;border-radius:3px;letter-spacing:1px}

main{display:grid;grid-template-columns:290px minmax(0,1fr) 350px;flex:1;min-height:0}
@media (max-width:1180px){main{grid-template-columns:260px minmax(0,1fr)}.ledger{grid-column:1/-1;border-left:0;border-top:6px solid #241708}}
@media (max-width:820px){main{grid-template-columns:1fr}.board{border-right:0}}

/* ---------- quest board ---------- */
.board{background:repeating-linear-gradient(90deg,#3a2712 0 26px,#432d15 26px 28px),#3a2712;border-right:6px solid #241708;padding:14px;overflow:auto}
.board h2{font-family:var(--title);color:var(--gold);text-align:center;font-size:24px;margin:0 0 14px;text-shadow:1px 1px 0 #000;font-weight:400}
.quest{position:relative;background:linear-gradient(var(--parch),var(--parch2));color:var(--ink);padding:18px 14px 14px;margin:0 6px 16px;box-shadow:3px 4px 0 #0007;transform:rotate(var(--r));cursor:pointer;border:1px solid #c9b58a;transition:transform .15s}
.quest:nth-child(odd){--r:-1.2deg}.quest:nth-child(even){--r:1deg}
.quest:hover{transform:rotate(0) scale(1.02)}
.quest.sel{outline:3px solid var(--gold);transform:rotate(0)}
.pin{position:absolute;top:-7px;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ff7b7b,#a11);box-shadow:0 2px 0 #0006}
.qtitle{font-size:15px;line-height:1.3;font-style:italic;margin-bottom:8px;padding-right:56px}
.qmeta{font-size:12.5px;color:var(--ink2);line-height:1.45;padding-right:56px;overflow:hidden;text-overflow:ellipsis}
.qmeta b{color:var(--ink)}
.seal{position:absolute;right:10px;bottom:10px;width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:var(--title);font-size:10px;line-height:1.1;color:#fff;text-shadow:0 1px 0 #0008;transform:rotate(-12deg);box-shadow:inset 0 0 0 3px #fff3,0 2px 0 #0006;padding:4px}
.seal.busy{background:radial-gradient(#7fdc7f,#2f8a3a)}.seal.waiting{background:radial-gradient(#ffd27f,#c76b12);animation:sealpulse 1.4s infinite}.seal.idle{background:radial-gradient(#bdb6a8,#6e665a)}
@keyframes sealpulse{50%{transform:rotate(-12deg) scale(1.12)}}
.qparty{margin-top:8px;font-size:12px;display:flex;gap:5px;align-items:center;color:var(--ink2)}
.qparty i{width:8px;height:8px;border-radius:50%;display:inline-block}

/* ---------- great hall ---------- */
.hall{position:relative;overflow:auto;padding:22px 28px 30px}
.hall h2{font-family:var(--title);color:var(--gold);font-size:26px;margin:0 0 18px;padding:0 44px;text-shadow:2px 2px 0 #000;font-weight:400;display:flex;align-items:center;gap:14px}
.hall h2 span{font-family:var(--fell);font-size:13px;color:#b9a98a;text-shadow:none}
.torch{position:absolute;top:14px;width:14px;height:44px;pointer-events:none}
.torch::before{content:"";position:absolute;bottom:0;left:4px;width:6px;height:28px;background:linear-gradient(#7a532c,#3e2812)}
.torch::after{content:"";position:absolute;top:0;left:-4px;width:22px;height:22px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:radial-gradient(circle at 50% 75%,#fff3a0,#ff8c3a 45%,#ff3d00 78%,transparent 82%);animation:flick .18s infinite alternate;box-shadow:0 0 22px #ff8c3a99}
@keyframes flick{from{transform:scaleY(1)}to{transform:scaleY(1.15) scaleX(.9) translateY(-2px)}}
.camp{position:relative;margin:0 auto 26px;max-width:900px;cursor:pointer;transition:filter .3s,transform .15s}
.camp:hover{transform:translateY(-2px)}
.banner{display:flex;align-items:center;gap:12px;background:linear-gradient(#7a1e1e,#5a1414);border:3px solid #3a0d0d;border-bottom:0;color:#f4e6c8;padding:8px 14px;position:relative}
.banner::before,.banner::after{content:"";position:absolute;top:-10px;width:12px;height:12px;background:#e0b354;border-radius:50%;box-shadow:0 2px 0 #0006}
.banner::before{left:12px}.banner::after{right:12px}
.banner .pname{font-family:var(--title);font-size:22px;color:var(--gold);text-shadow:1px 1px 0 #000;white-space:nowrap}
.banner .realm{font-size:12.5px;color:#e8d7b3aa;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.tag{font-family:var(--title);font-size:13px;padding:3px 10px;border-radius:3px;color:#2a1808;white-space:nowrap}
.tag.busy{background:var(--work)}.tag.waiting{background:var(--wait);animation:sealpulse2 1.4s infinite}.tag.idle{background:var(--idle)}
@keyframes sealpulse2{50%{box-shadow:0 0 12px var(--wait)}}
.mana{display:flex;align-items:center;gap:6px;font-size:12px;white-space:nowrap}
.mana .bar{width:80px;height:8px;background:#1a1030;border:1px solid #6a4fb0;border-radius:2px;overflow:hidden}.mana .bar i{display:block;height:100%;background:linear-gradient(90deg,#4d7cff,#a06bff)}
.tablearea{position:relative;border:3px solid #1a120b;padding:18px 20px 0;min-height:210px;display:flex;align-items:flex-end;overflow:hidden;
 background:repeating-linear-gradient(0deg,#0004 0 2px,transparent 2px 28px),repeating-linear-gradient(90deg,#0004 0 2px,transparent 2px 56px),linear-gradient(#3a2f24,#2f261c)}
.table{position:absolute;left:34px;right:34px;bottom:30px;height:40px;background:linear-gradient(#8a5a2b,#6a4220);border-top:4px solid #a8733a;border-radius:4px;box-shadow:0 4px 0 #0006}
.table::before,.table::after{content:"";position:absolute;bottom:-30px;width:10px;height:30px;background:#5a3b1e}
.table::before{left:14px}.table::after{right:14px}
.party{position:relative;z-index:1;display:flex;flex-wrap:wrap;row-gap:18px;align-items:flex-end;justify-content:center;gap:16px;width:100%;padding-bottom:6px}

/* ---------- adventurer ---------- */
.adv{position:relative;display:flex;flex-direction:column;align-items:center;width:124px;flex:0 0 auto;--sc:var(--idle)}
.adv.captain{width:136px}
.adv.working{--sc:var(--work)}.adv.thinking{--sc:var(--think)}.adv.waiting{--sc:var(--wait)}.adv.idle{--sc:var(--idle)}.adv.done{--sc:var(--done)}
.adv svg{display:block}
.adv.sel svg{filter:drop-shadow(0 0 10px var(--gold))}
.adv.done svg{opacity:.7}
.scroll{position:relative;margin-bottom:12px;min-width:118px;max-width:172px;background:linear-gradient(var(--parch),var(--parch2));color:var(--ink);padding:6px 12px;font-size:12.5px;line-height:1.3;box-shadow:0 2px 0 #0007;border-top:3px solid var(--sc);border-bottom:3px solid var(--sc);text-align:left}
.scroll::before,.scroll::after{content:"";position:absolute;top:-4px;bottom:-4px;width:8px;background:#c9b07f;border:1px solid #8a7248;border-radius:3px}
.scroll::before{left:-6px}.scroll::after{right:-6px}
.scroll code{font-family:ui-monospace,Menlo,monospace;font-size:11px;background:#0002;padding:0 3px;border-radius:2px;word-break:break-all}
.adv.waiting .scroll{animation:glow 1.4s infinite;background:linear-gradient(#fff1c9,#f5d98f)}
@keyframes glow{50%{box-shadow:0 0 16px var(--wait),0 2px 0 #0007}}
.adv.idle .scroll{opacity:.85}
.adv .nm{font-size:13px;color:#f4e6c8;text-align:center;line-height:1.15;margin-top:5px;text-shadow:0 1px 0 #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.adv .nm small{display:block;color:var(--gold);font-size:11px;font-style:italic}
.sparks{position:absolute;right:8px;top:calc(100% - 104px);width:30px;height:30px;pointer-events:none}
.sparks i{position:absolute;width:5px;height:5px;background:var(--magic);box-shadow:0 0 6px var(--magic);animation:spark 1.2s infinite;opacity:0}
.sparks i:nth-child(2){left:14px;top:8px;animation-delay:.4s;background:#fff}
.sparks i:nth-child(3){left:6px;top:18px;animation-delay:.8s;background:#ffe27a}
@keyframes spark{0%{opacity:0;transform:translateY(6px) scale(.6)}40%{opacity:1}100%{opacity:0;transform:translateY(-14px) scale(1.1)}}
.rune{position:absolute;top:calc(100% - 118px);left:58%;font-family:var(--title);font-size:22px;color:var(--think);animation:zz 2s infinite;text-shadow:0 0 8px var(--think);pointer-events:none}
.zz{position:absolute;top:calc(100% - 112px);left:58%;font-family:var(--title);font-size:16px;color:#e8d7b3;pointer-events:none;animation:zz 2.4s infinite 1.6s}
.zz i,.zz b{position:absolute;left:8px;top:-8px;font-style:normal;font-weight:400;animation:zz 2.4s infinite}
.zz b{left:16px;top:-16px;animation-delay:.8s}
@keyframes zz{0%{opacity:0;transform:translateY(4px)}30%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
.working .weapon{animation:bob 1s ease-in-out infinite;transform-origin:50px 60px}
@keyframes bob{50%{transform:rotate(-8deg)}}
.working .orb{animation:orb .9s infinite alternate}
@keyframes orb{from{r:4}to{r:6.5}}
.thinking .head{animation:nod 1.8s ease-in-out infinite;transform-origin:27px 44px}
@keyframes nod{50%{transform:rotate(-6deg)}}
.waiting .held{animation:wave .7s ease-in-out infinite alternate;transform-origin:43px 48px}
@keyframes wave{from{transform:rotate(-6deg)}to{transform:rotate(8deg)}}
.hall .camp.dim{filter:brightness(.45) saturate(.5)}

/* ---------- party (single session) view ---------- */
.crumbs{display:flex;align-items:center;gap:14px;margin-bottom:14px;font-size:15px;color:#b9a98a;padding:0 44px}
.camp.big{cursor:default}.camp.big:hover{transform:none}
.camp.big .tablearea{min-height:380px;padding:22px 18px 0}
.camp.big .party{gap:10px;row-gap:18px}
.camp.big .table{display:none}
.camp.big .adv{width:138px}.camp.big .adv.captain{width:152px}
.camp.big .adv svg{width:96px;height:132px}
.camp.big .scroll{font-size:14px;max-width:200px;min-width:140px}
.camp.big .scroll code{font-size:12.5px}
.camp.big .adv .nm{font-size:15px}
.camp.big .sparks{right:14px;top:calc(100% - 146px)}
.camp.big .rune,.camp.big .zz{top:calc(100% - 168px);font-size:26px}
.fire{position:relative;width:80px;height:110px;flex:0 0 auto;align-self:flex-end;margin:0 4px}
.fire .log{position:absolute;bottom:8px;left:12px;width:66px;height:12px;background:linear-gradient(#7a532c,#3e2812);border-radius:6px;transform:rotate(-14deg)}
.fire .log.l2{transform:rotate(14deg)}
.fire .flame{position:absolute;bottom:18px;left:50%;width:34px;height:56px;margin-left:-17px;background:radial-gradient(circle at 50% 92%,#fff7b0,#ffb347 35%,#ff5a1f 65%,transparent 72%);border-radius:50% 50% 50% 50%/70% 70% 30% 30%;animation:flame .25s infinite alternate}
.fire .flame.f2{width:20px;height:36px;margin-left:-6px;animation-delay:.12s;opacity:.9}
.fire .flame.f3{width:16px;height:30px;margin-left:-16px;animation-delay:.2s;opacity:.8}
@keyframes flame{from{transform:scaleY(1)}to{transform:scaleY(1.18) translateY(-3px) scaleX(.9)}}
.fireglow{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 88%,#ff8c3a40,transparent 42%);pointer-events:none;animation:glowp 1s infinite alternate}
@keyframes glowp{to{opacity:.6}}
.sheets{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;max-width:900px;margin:16px auto 0}
.sheet{position:relative;background:linear-gradient(var(--parch),var(--parch2));color:var(--ink);padding:12px 14px;box-shadow:3px 3px 0 #0007;border:1px solid #c9b58a;border-left:6px solid var(--sc);cursor:pointer;--sc:var(--idle)}
.sheet.working{--sc:var(--work)}.sheet.thinking{--sc:var(--think)}.sheet.waiting{--sc:var(--wait)}.sheet.idle{--sc:var(--idle)}.sheet.done{--sc:var(--done)}
.sheet.sel{outline:3px solid var(--gold)}
.sheet .h{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.sheet .h b{font-family:var(--title);font-size:18px;font-weight:400;color:var(--blood)}
.sheet .h i{font-size:12px;color:var(--ink2)}
.sheet .st{font-size:12px;margin-top:2px;color:var(--ink2)}
.sheet .task{font-size:13px;margin-top:8px;line-height:1.35}
.sheet code{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;background:#0002;padding:0 3px;border-radius:2px;word-break:break-all}
.sheet .sub{font-size:11.5px;color:var(--ink2);margin-top:8px;display:flex;justify-content:space-between}

/* ---------- ledger ---------- */
.ledger{background:#2a1d10;border-left:6px solid #241708;padding:14px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.page{background:linear-gradient(var(--parch),var(--parch2));color:var(--ink);padding:12px 14px;box-shadow:2px 3px 0 #0007;border:1px solid #c9b58a}
.page h3{margin:0 0 8px;font-family:var(--title);font-size:20px;color:var(--blood);font-weight:400;display:flex;align-items:center;gap:8px}
.page.attn{background:linear-gradient(#fff1c9,#f5d98f);border-color:#c76b12}
.page .muted{color:var(--ink2)}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px dashed #b8a67f;font-size:12.5px}
.row:first-of-type{border-top:0}.row.click{cursor:pointer}.row.click:hover,.row.on{background:#0001;margin:0 -6px;padding-left:6px;padding-right:6px}
.mini{width:74px;text-align:right;font-size:11px;color:var(--ink2)}
.bar{height:8px;background:#1a1030;border:1px solid #6a4fb0;border-radius:2px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#4d7cff,#a06bff)}
.bar.hp{background:#2a0a0a;border-color:#a33}.bar.hp i{background:linear-gradient(90deg,#d33,#ff7b7b)}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:5px 14px;font-size:12.5px;margin:0}
.kv dt{color:var(--ink2)}.kv dd{margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prompt{margin:0;font-size:14px;line-height:1.45;font-style:italic}
.feed{display:flex;flex-direction:column;gap:8px;font-size:12.5px}
.ev{display:grid;grid-template-columns:38px 20px minmax(0,1fr);gap:6px;align-items:start;line-height:1.35}
.ev .t{color:var(--ink2);font-variant-numeric:tabular-nums;font-size:11.5px;padding-top:1px}
.ev code{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;background:#0002;padding:0 3px;border-radius:2px;word-break:break-all}
.ev.you{color:var(--blood)}
.btn{font-family:var(--title);font-size:13px;background:var(--blood);color:#f4e6c8;border:2px solid #3a0d0d;padding:4px 10px;border-radius:3px;cursor:pointer;white-space:nowrap;box-shadow:0 2px 0 #0006}
.btn:hover{background:#7a1e1e}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:12px}
.legend span{display:flex;align-items:center;gap:8px}
.src{margin:0;padding-left:18px;font-size:12px;line-height:1.55;color:var(--ink2)}
.src code{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--ink)}
footer{padding:8px 18px;background:#2a1808;border-top:4px solid #4a2f16;font-size:12px;color:#b9a98a;display:flex;gap:14px;flex-wrap:wrap;justify-content:space-between}
kbd{font-family:ui-monospace,Menlo,monospace;font-size:10.5px;background:#4a2f16;border:1px solid #6b4623;border-radius:3px;padding:0 5px;color:#f4e6c8}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">⚔ The Adventurers' Guild <span class="sub">Mockup B · fantasy guild hall</span></div>
  <nav class="views" id="views"></nav>
  <div class="stats"><span class="ribbon">SAMPLE DATA</span><span id="st-sessions"></span><span id="st-agents"></span><span class="warn" id="st-wait"></span><span class="clock" id="clock"></span></div>
</header>
<main>
  <aside class="board" id="board"></aside>
  <section class="hall" id="hall"></section>
  <aside class="ledger" id="ledger"></aside>
</main>
<footer>
  <span>Each party is one Claude Code session. The Captain is the session lead; Rangers, Sages and Warriors are the subagents it summoned.</span>
  <span>Click a quest or a party to open its camp · <kbd>0</kbd> great hall · <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> parties · <kbd>Esc</kbd> back</span>
</footer>

<script>
/* ===================== sample data (same three sessions as mockup A) ===================== */
const NOW=Date.now(),S=1000,M=60*S,H=60*M;
const ICON={Grep:'🔮',Read:'📖',Bash:'⚡',Edit:'🔨',Write:'✒️',Agent:'🧙',Glob:'🗺️',WebFetch:'🐦'};
const VERB={Grep:'scrying for',Read:'reading the tome',Bash:'casting the rune',Edit:'reforging',Write:'inscribing',Agent:'summoning',Glob:'surveying',WebFetch:'sending a raven to'};
const PAST={Grep:'scried',Read:'read the tome',Bash:'cast the rune',Edit:'reforged',Write:'inscribed',Agent:'summoned',Glob:'surveyed',WebFetch:'sent a raven to'};
const STATE_LABEL={working:'on the quest',thinking:'pondering',waiting:'awaits your seal',idle:'resting',done:'quest complete'};
const STATUS_LABEL={busy:'Underway',waiting:'Awaits seal',idle:'Resting'};
const CLASS={lead:{cls:'captain',label:'Captain · session lead',color:'#3b4fd8',pants:'#2a2f5a'},Explore:{cls:'ranger',label:'Ranger · Explore',color:'#2f7a3a',pants:'#3a2a1a'},Plan:{cls:'sage',label:'Sage · Plan',color:'#6a3fb8',pants:'#3a2a5a'},'general-purpose':{cls:'warrior',label:'Warrior · general',color:'#8a4a2a',pants:'#3a2a1a'},'code-review':{cls:'paladin',label:'Paladin · review',color:'#c9a24a',pants:'#5a4a2a'}};

const SESSIONS=[
 {id:'ws',num:1,pid:87328,name:'agent workspace',cwd:'~/Documents/GitHub/agent-workspace',branch:'main',status:'busy',startedAt:NOW-11*M,ctx:23,turns:6,tokIn:148200,tokOut:9400,model:'fable-5.1',
  prompt:'Draft HTML mockups for a 2D gamified dashboard of sessions and agents',
  agents:[
   {id:'main',type:'lead',name:'Lead',state:'thinking',tool:null,task:'what the scouts brought back',since:NOW-40*S},
   {id:'ex1',type:'Explore',name:'Explore · hooks',state:'working',tool:'Grep',task:'"SubagentStart" in ~/.claude',since:NOW-3*M},

function byId(id){return SESSIONS.find(s=>s.id===id)}
function ago(t){let d=Math.max(0,Date.now()-t)/1000;if(d<60)return Math.floor(d)+'s';if(d<3600)return Math.floor(d/60)+'m';return Math.floor(d/3600)+'h '+Math.floor(d%3600/60)+'m'}
function agoSpan(t){return `<span data-ago="${t}">${ago(t)}</span>`}

function fmtTok(n){return n>=1e6?(n/1e6).toFixed(2)+'M':n>=1e3?Math.round(n/1e3)+'k':n}
function agentCount(){return SESSIONS.reduce((n,s)=>n+s.agents.length,0)}
function waitingList(){const w=[];SESSIONS.forEach(s=>s.agents.forEach(a=>{if(a.state==='waiting')w.push([s,a])}));return w}

 if(!pool.length)return;

 const opts=ROTATE[a.type].filter(o=>o.task!==a.task);const o=opts[Math.floor(Math.random()*opts.length)];
 a.tool=o.tool;a.task=o.task;a.since=Date.now();
 s.feed.unshift({t:Date.now(),who:a.name,tool:o.tool,text:o.task});
 refreshAgent(s,a);
},3600);
