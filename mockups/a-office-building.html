<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent Office · Mockup A · Office Building</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0f1e;--panel:#111a30;--panel2:#0d1527;--line:#26324f;--text:#e8edff;--muted:#8e99bb;
  --work:#3ddc97;--think:#6aa6ff;--wait:#ffb347;--idle:#7f8ba6;--done:#b48cff;
  --brick:#2b3457;--brick2:#232b4a;--frame:#3a4670;--plate:#465390;--winon:#ffd98a;--winoff:#182242;
  --pix:'Press Start 2P',monospace;--game:'VT323',ui-monospace,monospace;
  --ui:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--ui);font-size:14px;display:flex;flex-direction:column;min-height:100vh}
button{font:inherit}
.muted{color:var(--muted)}.small{font-size:11.5px}.grow{flex:1;min-width:0}

/* ---------- top bar ---------- */
.topbar{display:flex;align-items:center;gap:16px;padding:10px 18px;border-bottom:1px solid var(--line);background:linear-gradient(#131c33,#0f172b);flex-wrap:wrap}
.brand{font-family:var(--pix);font-size:12px;display:flex;align-items:center;gap:10px;white-space:nowrap}
.brand .sub{font-family:var(--ui);font-size:12px;color:var(--muted)}
.views{display:flex;gap:6px;flex-wrap:wrap}
.views button{font-family:var(--game);font-size:18px;line-height:1;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:#0e1730;color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:8px}
.views button.on{background:#1b2750;color:var(--text);border-color:#3b4f8f}
.views button:hover{color:var(--text)}
.views small{font-size:13px;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:0 0 auto}
.dot.busy,.pill.busy{background:var(--work)}.dot.waiting,.pill.waiting{background:var(--wait)}.dot.idle,.pill.idle{background:var(--idle)}
.stats{margin-left:auto;display:flex;gap:16px;font-family:var(--game);font-size:19px;color:var(--muted);align-items:center}
.stats b{color:var(--text)}.stats .warn b{color:var(--wait)}
.stats .clock{font-variant-numeric:tabular-nums;color:var(--text);padding-left:12px;border-left:1px solid var(--line)}
.ribbon{font-family:var(--pix);font-size:8px;color:#0a0f1e;background:var(--wait);padding:4px 8px;border-radius:4px;letter-spacing:1px}

main{display:grid;grid-template-columns:minmax(0,1fr) 390px;flex:1;min-height:0}
@media (max-width:1000px){main{grid-template-columns:1fr}.panel{border-left:0;border-top:1px solid var(--line)}}

/* ---------- scene: night sky ---------- */
.scene{position:relative;overflow:auto;padding:28px 24px 0;
 background:
  radial-gradient(1.5px 1.5px at 8% 12%,#fff 70%,transparent 71%),radial-gradient(1px 1px at 22% 30%,#fff 70%,transparent 71%),
  radial-gradient(1.5px 1.5px at 37% 8%,#fff 70%,transparent 71%),radial-gradient(1px 1px at 52% 22%,#cfe0ff 70%,transparent 71%),
  radial-gradient(1px 1px at 66% 14%,#fff 70%,transparent 71%),radial-gradient(1.5px 1.5px at 80% 28%,#fff 70%,transparent 71%),
  radial-gradient(1px 1px at 91% 9%,#fff 70%,transparent 71%),radial-gradient(1px 1px at 15% 55%,#fff 70%,transparent 71%),
  radial-gradient(1px 1px at 88% 48%,#fff 70%,transparent 71%),radial-gradient(1px 1px at 45% 40%,#fff 70%,transparent 71%),
  linear-gradient(#060a16 0%,#0c1330 50%,#16204a 100%)}
.moon{position:absolute;right:9%;top:34px;width:46px;height:46px;border-radius:50%;background:#f4f0d8;box-shadow:0 0 30px #f4f0d866,inset -10px -6px 0 #d9d3b2}

/* ---------- building ---------- */
.building{position:relative;display:grid;grid-template-columns:56px minmax(0,1fr);max-width:940px;margin:20px auto 0;align-items:stretch}
.shaft{position:relative;background:#141b36;border:3px solid var(--frame);border-right:0;border-bottom:0;background-image:repeating-linear-gradient(0deg,transparent 0 22px,#1f2a4d 22px 24px)}
.cab{position:absolute;left:6px;right:6px;height:60px;background:#3a4a86;border:2px solid #7f92d8;border-radius:3px;transition:top .6s cubic-bezier(.45,.05,.2,1);box-shadow:0 0 14px #7f92d866}
.cab::before{content:"";position:absolute;inset:8px 8px 10px;background:linear-gradient(#b7c4ff44,#b7c4ff11);border-radius:2px}
.cab::after{content:"▲▼";position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:9px;color:#7f92d8;letter-spacing:2px}
.tower{border:3px solid var(--frame);border-bottom:0;background:repeating-linear-gradient(0deg,var(--brick) 0 10px,var(--brick2) 10px 20px)}
.roof{height:54px;position:relative;background:#1a2346;border-bottom:3px solid var(--frame);display:flex;align-items:center;justify-content:center}
.sign{font-family:var(--pix);font-size:11px;color:#ffe8a3;text-shadow:0 0 6px #ffcf5a,0 0 16px #ff9d00;padding:9px 16px;border:2px solid #5a4a1e;background:#2a2410;letter-spacing:1px;animation:neon 4s infinite}
@keyframes neon{0%,92%,100%{opacity:1}94%{opacity:.55}96%{opacity:1}98%{opacity:.7}}
.antenna{position:absolute;right:52px;top:-30px;width:3px;height:30px;background:#5a6690}
.antenna::after{content:"";position:absolute;top:-7px;left:-3px;width:9px;height:9px;border-radius:50%;background:#ff4d4d;box-shadow:0 0 8px #ff4d4d;animation:blink 1.6s infinite}
@keyframes blink{0%,45%{opacity:1}50%,95%{opacity:.15}100%{opacity:1}}

.floor{position:relative;height:var(--fh);border-bottom:6px solid var(--plate);display:grid;grid-template-columns:190px minmax(0,1fr);cursor:pointer;transition:filter .3s}
.floor:hover .tag{background:#20294d}
.tag{padding:10px 12px;border-right:3px solid var(--frame);background:#1a2242;display:flex;flex-direction:column;gap:5px;justify-content:center;min-width:0}
.tag .num{font-family:var(--pix);font-size:8px;color:var(--muted);letter-spacing:1px}
.tag .name{font-family:var(--game);font-size:22px;line-height:.95;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag .meta{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-family:var(--game);font-size:15px;line-height:1;padding:3px 7px;border-radius:5px;width:max-content;color:#0a0f1e;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.room{position:relative;overflow:hidden;background:linear-gradient(#2a3563 0,#242d58 60%,#1e2749 100%)}
.room::before{content:"";position:absolute;left:18px;right:18px;top:10px;height:30px;border-radius:2px;
 background:repeating-linear-gradient(90deg,var(--w) 0 44px,transparent 44px 70px)}
.room::after{content:"";position:absolute;left:0;right:0;bottom:0;height:14px;background:#1a2242;border-top:2px solid #2f3a63}
.floor.busy .room::before{--w:var(--winon)}
.floor.idle .room::before{--w:var(--winoff)}
.floor.waiting .room::before{--w:#ffb347;animation:winpulse 1.4s ease-in-out infinite}
@keyframes winpulse{0%,100%{opacity:1}50%{opacity:.35}}
.workers{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:flex-end;gap:14px;padding:0 20px 14px;z-index:1}
.worker{position:relative;display:flex;flex-direction:column;align-items:center;width:104px;flex:0 0 auto;--sc:var(--idle)}
.worker.lead{width:116px}
.floor:not(.big) .bubble{min-width:0;max-width:160px}
.floor:not(.big) .bt{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:144px}
.worker svg{display:block}
.worker .nm{font-family:var(--game);font-size:15px;line-height:1;color:#c9d3f5;position:absolute;bottom:-13px;left:-6px;right:-6px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.worker.working{--sc:var(--work)}.worker.thinking{--sc:var(--think)}.worker.waiting{--sc:var(--wait)}.worker.idle{--sc:var(--idle)}.worker.done{--sc:var(--done)}
.bubble{position:relative;margin-bottom:9px;min-width:124px;max-width:190px;background:#f7f9ff;color:#111a30;border-radius:8px;padding:5px 8px;font-size:11.5px;line-height:1.25;box-shadow:0 2px 0 #0006;border:2px solid var(--sc);text-align:left}
.bubble::after{content:"";position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);border:6px solid transparent;border-top-color:var(--sc);border-bottom:0}
.bubble code{font-family:ui-monospace,Menlo,monospace;font-size:10.5px;background:#e6ebfa;padding:0 3px;border-radius:3px;word-break:break-all}
.worker.waiting .bubble{animation:shake 2.2s infinite;background:#fff4e0}
@keyframes shake{0%,90%,100%{transform:translateX(0)}92%{transform:translateX(-2px)}94%{transform:translateX(2px)}96%{transform:translateX(-1px)}}
.worker.idle .bubble{opacity:.8}
.worker.done{opacity:.72}
.zz{position:absolute;top:46px;left:58%;font-family:var(--game);font-size:16px;color:#c9d3f5;pointer-events:none;animation:zz 2.4s infinite 1.6s}
.zz i,.zz b{position:absolute;left:8px;top:-8px;font-style:normal;font-weight:400;animation:zz 2.4s infinite}
.zz b{left:16px;top:-16px;animation-delay:.8s}
@keyframes zz{0%{opacity:0;transform:translateY(4px)}30%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
/* sprite animation */
.working .arm{animation:type .32s steps(2,end) infinite}
@keyframes type{to{transform:translateY(-2px)}}
.working .screen{animation:flick 1.1s steps(3) infinite}
@keyframes flick{0%{opacity:1}50%{opacity:.75}100%{opacity:1}}
.thinking .head{animation:nod 1.8s ease-in-out infinite;transform-origin:19px 38px}
@keyframes nod{0%,100%{transform:rotate(0)}50%{transform:rotate(-6deg)}}
.thinking .screen{opacity:.7}
.waiting .armup{animation:wave .7s ease-in-out infinite alternate;transform-origin:26px 38px}
@keyframes wave{from{transform:rotate(-8deg)}to{transform:rotate(10deg)}}
.lobby{height:64px;display:flex;align-items:center;gap:22px;padding:0 16px;background:#1a2242;border-top:3px solid var(--frame);font-family:var(--game);font-size:18px;color:var(--muted)}
.lobby .door{width:34px;height:44px;background:#4a5a9a;border:3px solid #7f92d8;border-bottom:0;margin-top:20px;position:relative;flex:0 0 auto}
.lobby .door::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:2px;background:#2a3563}
.ground{max-width:940px;margin:0 auto 30px;height:26px;background:linear-gradient(#2d3a2d,#1c241c);border-top:3px solid #4a6b4a;border-radius:0 0 6px 6px}

/* ---------- single-session view ---------- */
.focus{max-width:940px;margin:0 auto 30px}
.crumbs{display:flex;align-items:center;gap:14px;margin-bottom:12px;font-family:var(--game);font-size:20px;color:var(--muted)}
.tower.solo{border-bottom:6px solid var(--plate)}
.floor.big{--fh:340px;grid-template-columns:200px minmax(0,1fr);cursor:default;border-bottom:0}
.floor.big .tag .name{font-size:30px}
.floor.big .room::before{height:60px;top:16px}
.floor.big .workers{gap:12px;padding:0 18px 18px}
.floor.big .room::after{height:18px}
.floor.big .worker{width:118px}.floor.big .worker.lead{width:132px}
.floor.big .worker svg{width:92px;height:115px}
.floor.big .bubble{font-size:13px;max-width:200px;min-width:130px}
.floor.big .bubble code{font-size:12px}
.floor.big .worker .nm{font-size:18px;bottom:-16px}
.floor.big .zz{top:74px;font-size:22px}
.worker.sel svg{filter:drop-shadow(0 0 8px #fff)}
.agents{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:10px;margin-top:14px}
.acard{background:var(--panel2);border:1px solid var(--line);border-left:4px solid var(--sc);border-radius:10px;padding:10px 12px;cursor:pointer;--sc:var(--idle)}
.acard:hover{background:#121c36}.acard.sel{outline:2px solid #ffffff33;background:#131d38}
.acard.working{--sc:var(--work)}.acard.thinking{--sc:var(--think)}.acard.waiting{--sc:var(--wait)}.acard.idle{--sc:var(--idle)}.acard.done{--sc:var(--done)}
.acard .h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-family:var(--game);font-size:20px;line-height:1}
.acard .st{font-size:15px;color:var(--sc);white-space:nowrap}
.acard .task{font-size:12.5px;margin-top:7px;color:#dfe6ff;word-break:break-word}
.acard .sub{font-size:11.5px;color:var(--muted);margin-top:6px;display:flex;justify-content:space-between}
.acard code{font-family:ui-monospace,Menlo,monospace;font-size:11px;background:#0a1226;padding:1px 4px;border-radius:4px}

/* ---------- side panel ---------- */
.panel{border-left:1px solid var(--line);background:var(--panel);padding:16px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.card h3{margin:0 0 8px;font-family:var(--game);font-size:21px;font-weight:400;color:#c9d3f5;letter-spacing:.3px;display:flex;align-items:center;gap:8px}
.card.attn{border-color:#6b4d1a;background:linear-gradient(#1a1608,#0d1527)}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px dashed #22304f;font-size:12.5px}
.row:first-of-type{border-top:0}.row.click{cursor:pointer}.row.click:hover{background:#0f1830;margin:0 -6px;padding-left:6px;padding-right:6px;border-radius:6px}
.row.on{background:#131d38;margin:0 -6px;padding-left:6px;padding-right:6px;border-radius:6px}
.mini{width:70px;text-align:right}
.bar{height:7px;background:#1a2440;border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--think),var(--work));border-radius:4px}
.bar.hot i{background:linear-gradient(90deg,var(--wait),#ff6b6b)}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:5px 14px;font-size:12.5px;margin:0}
.kv dt{color:var(--muted)}.kv dd{margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prompt{margin:0;font-size:13px;line-height:1.45;color:#e6ecff;font-style:italic}
.feed{display:flex;flex-direction:column;gap:7px;font-size:12.5px}
.ev{display:grid;grid-template-columns:40px 20px minmax(0,1fr);gap:6px;align-items:start;line-height:1.35}
.ev .t{color:var(--muted);font-variant-numeric:tabular-nums;font-size:11.5px;padding-top:1px}
.ev .w{color:#c9d3f5}
.ev code{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;background:#0a1226;padding:1px 4px;border-radius:4px;word-break:break-all}
.ev.you .w{color:var(--wait)}
.btn{font-family:var(--game);font-size:16px;line-height:1;padding:5px 9px;border-radius:6px;border:1px solid #3b4f8f;background:#1b2750;color:var(--text);cursor:pointer;white-space:nowrap}
.btn:hover{background:#243466}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:12px}
.legend span{display:flex;align-items:center;gap:8px}
.src{margin:0;padding-left:18px;font-size:12px;line-height:1.55;color:var(--muted)}
.src code{color:#c9d3f5;font-family:ui-monospace,Menlo,monospace;font-size:11px}
footer{padding:8px 18px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap;justify-content:space-between}
kbd{font-family:ui-monospace,Menlo,monospace;font-size:10.5px;background:#1a2440;border:1px solid #2c3a66;border-radius:4px;padding:0 5px}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">🏢 AGENT OFFICE <span class="sub">Mockup A · night-time office building</span></div>
  <nav class="views" id="views"></nav>
  <div class="stats"><span class="ribbon">SAMPLE DATA</span><span id="st-sessions"></span><span id="st-agents"></span><span class="warn" id="st-wait"></span><span class="clock" id="clock"></span></div>
</header>
<main>
  <section class="scene" id="scene"></section>
  <aside class="panel" id="panel"></aside>
</main>
<footer>
  <span>Each floor is one Claude Code session. Each worker is an agent inside it: the session lead plus any subagents it spawned.</span>
  <span>Click a floor to zoom in · <kbd>0</kbd> whole building · <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> floors · <kbd>Esc</kbd> back</span>
</footer>

<script>
/* ===================== sample data ===================== */
const NOW=Date.now(),S=1000,M=60*S,H=60*M;
const ICON={Grep:'🔍',Read:'📖',Bash:'💻',Edit:'✏️',Write:'📝',Agent:'🧬',Glob:'🗂️',WebFetch:'🌐'};
const STATE_LABEL={working:'working',thinking:'thinking',waiting:'needs approval',idle:'idle',done:'finished'};
const STATUS_LABEL={busy:'busy',waiting:'needs you',idle:'idle'};
const TYPE_LABEL={lead:'Session lead',Explore:'Explore subagent',Plan:'Plan subagent','general-purpose':'General subagent','code-review':'Review subagent'};

const SESSIONS=[
 {id:'ws',num:3,pid:87328,name:'agent workspace',cwd:'~/Documents/GitHub/agent-workspace',branch:'main',status:'busy',startedAt:NOW-11*M,ctx:23,turns:6,tokIn:148200,tokOut:9400,model:'fable-5.1',
  prompt:'Draft HTML mockups for a 2D gamified dashboard of sessions and agents',
  agents:[
   {id:'main',type:'lead',name:'Lead',state:'thinking',tool:null,task:'Reviewing what the subagents found',since:NOW-40*S},
   {id:'ex1',type:'Explore',name:'Explore · hooks',state:'working',tool:'Grep',task:'"SubagentStart" in ~/.claude',since:NOW-3*M},
   {id:'ex2',type:'Explore',name:'Explore · registry',state:'working',tool:'Read',task:'sessions/87328.json',since:NOW-2*M},
   {id:'gp1',type:'general-purpose',name:'Builder',state:'working',tool:'Bash',task:'python3 server.py --check',since:NOW-5*M},
   {id:'pl1',type:'Plan',name:'Architect',state:'done',tool:null,task:'Plan delivered · 3 options',since:NOW-7*M},
  ],
  feed:[
   {t:NOW-11*M,who:'you',text:'Draft HTML mockups for a 2D gamified dashboard of sessions and agents'},
   {t:NOW-10*M-20*S,who:'Lead',tool:'Bash',text:'ls -la ~/.claude/sessions'},
   {t:NOW-9*M,who:'Lead',tool:'Agent',text:'spawned Explore · hooks'},
   {t:NOW-9*M+5*S,who:'Lead',tool:'Agent',text:'spawned Explore · registry'},
   {t:NOW-8*M,who:'Lead',tool:'Agent',text:'spawned Architect (Plan)'},
   {t:NOW-7*M,who:'Architect',tool:'Write',text:'plan.md · 3 options'},
   {t:NOW-6*M,who:'Lead',tool:'Agent',text:'spawned Builder'},
   {t:NOW-5*M,who:'Builder',tool:'Write',text:'server.py'},
   {t:NOW-3*M,who:'Explore · hooks',tool:'Grep',text:'"SubagentStart" in ~/.claude'},
   {t:NOW-2*M,who:'Explore · registry',tool:'Read',text:'sessions/87328.json'},
   {t:NOW-40*S,who:'Lead',text:'thinking…'},
  ]},
 {id:'jk',num:2,pid:30536,name:'jenkins-c0',cwd:'~/Documents/GitHub/jenkins',branch:'main',status:'waiting',startedAt:NOW-6*H-35*M,ctx:61,turns:42,tokIn:1240000,tokOut:88000,model:'fable-5.1',
  prompt:'Lock down Jenkins authorization and verify the API token wiring',
  agents:[
   {id:'main',type:'lead',name:'Lead',state:'waiting',tool:'Edit',task:'jenkins/casc.yaml',since:NOW-90*S},
   {id:'gp1',type:'general-purpose',name:'Runner',state:'working',tool:'Bash',task:'docker exec jenkins sh -c "grep authorizationStrategy …"',since:NOW-4*M},
  ],
  feed:[
   {t:NOW-6*H-35*M,who:'you',text:'Lock down Jenkins authorization and verify the API token wiring'},
   {t:NOW-20*M,who:'Lead',tool:'Read',text:'jenkins/casc.yaml'},
   {t:NOW-12*M,who:'Lead',tool:'Agent',text:'spawned Runner'},
   {t:NOW-9*M,who:'Runner',tool:'Bash',text:'docker exec jenkins cat /var/jenkins_home/config.xml'},
   {t:NOW-4*M,who:'Runner',tool:'Bash',text:'docker exec jenkins sh -c "grep authorizationStrategy …"'},
   {t:NOW-90*S,who:'Lead',tool:'Edit',text:'jenkins/casc.yaml · waiting for approval'},
  ]},
 {id:'hn',num:1,pid:88313,name:'harness',cwd:'~',branch:'—',status:'idle',startedAt:NOW-27*M,ctx:8,turns:3,tokIn:41000,tokOut:2100,model:'fable-5.1',
  prompt:'Review john_guard.py rules',
  agents:[{id:'main',type:'lead',name:'Lead',state:'idle',tool:null,task:'Waiting for your next prompt',since:NOW-12*M}],
  feed:[
   {t:NOW-27*M,who:'you',text:'Review john_guard.py rules'},
   {t:NOW-25*M,who:'Lead',tool:'Read',text:'~/.claude/harness/john-harness/john_guard.py'},
   {t:NOW-14*M,who:'Lead',tool:'Grep',text:'"deny" in john_guard.py'},
   {t:NOW-12*M,who:'Lead',text:'replied · 4 findings'},
  ]},
];
SESSIONS.forEach(s=>s.feed.sort((a,b)=>b.t-a.t));
if(!['all',...SESSIONS.map(s=>s.id)].includes((location.hash||'#all').slice(1)))history.replaceState(null,'','#all');

/* what working agents rotate through in the fake live feed */
const ROTATE={
 Explore:[{tool:'Grep',task:'"SubagentStop" in ~/.claude'},{tool:'Read',task:'subagents/agent-a1f3.jsonl'},{tool:'Glob',task:'~/.claude/sessions/*.json'},{tool:'Grep',task:'"messagingSocketPath"'},{tool:'Read',task:'sessions/30536.json'}],
 'general-purpose':[{tool:'Bash',task:'python3 server.py --check'},{tool:'Edit',task:'server.py · tail loop'},{tool:'Bash',task:'curl -s localhost:7777/api/sessions'},{tool:'Write',task:'static/index.html'},{tool:'Bash',task:'docker exec jenkins sh -c "grep authorizationStrategy …"'}],
};

/* ===================== helpers ===================== */
let view=(location.hash||'#all').slice(1),selAgent=null;
const $=id=>document.getElementById(id);
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function byId(id){return SESSIONS.find(s=>s.id===id)}
function ago(t){let d=Math.max(0,Date.now()-t)/1000;if(d<60)return Math.floor(d)+'s';if(d<3600)return Math.floor(d/60)+'m';return Math.floor(d/3600)+'h '+Math.floor(d%3600/60)+'m'}
function agoSpan(t){return `<span data-ago="${t}">${ago(t)}</span>`}
function hhmm(t){return new Date(t).toTimeString().slice(0,5)}
function fmtTok(n){return n>=1e6?(n/1e6).toFixed(2)+'M':n>=1e3?Math.round(n/1e3)+'k':n}
function cssState(st){return {working:'work',thinking:'think',waiting:'wait',idle:'idle',done:'done'}[st]}
function agentCount(){return SESSIONS.reduce((n,s)=>n+s.agents.length,0)}
function waitingList(){const w=[];SESSIONS.forEach(s=>s.agents.forEach(a=>{if(a.state==='waiting')w.push([s,a])}));return w}

/* ===================== pixel sprite ===================== */
const PAL={lead:{shirt:'#3b4fd8',hair:'#2b1d0e',acc:'tie'},Explore:{shirt:'#2f9e6b',hair:'#5a3a1a',acc:'binocs'},Plan:{shirt:'#7b5bd6',hair:'#8a8a8a',acc:'glasses'},'general-purpose':{shirt:'#e07a2f',hair:'#1a1a1a',acc:'hat'},'code-review':{shirt:'#d64b4b',hair:'#3a2a1a',acc:'badge'}};
function sprite(a){
 const p=PAL[a.type]||PAL.lead,skin='#f2c9a0';
 const screen={working:'#7cffb2',thinking:'#8fc0ff',waiting:'#ffb347',idle:'#1b2340',done:'#c9b3ff'}[a.state];
 const eyes=a.state==='idle'?`<rect x="21" y="30" width="3" height="1" fill="#111"/>`:`<rect x="22" y="29" width="2" height="2" fill="#111"/>`;
 let acc='';
 if(p.acc==='tie')acc=`<rect x="19" y="38" width="2" height="8" fill="#ffd166"/>`;
 if(p.acc==='binocs')acc=`<rect x="20" y="28" width="7" height="3" fill="#222"/><rect x="26" y="29" width="2" height="1" fill="#9ff"/>`;
 if(p.acc==='glasses')acc=`<rect x="20" y="28" width="6" height="4" fill="none" stroke="#111" stroke-width="1"/>`;
 if(p.acc==='hat')acc=`<rect x="11" y="20" width="16" height="4" fill="#ffcc33"/><rect x="13" y="17" width="12" height="3" fill="#ffcc33"/>`;
 if(p.acc==='badge')acc=`<rect x="14" y="40" width="3" height="3" fill="#ffd166"/>`;
 const arm=a.state==='waiting'
  ?`<g class="armup"><rect x="24" y="22" width="4" height="16" fill="${skin}"/><rect x="23" y="19" width="6" height="4" fill="${skin}"/></g>`
  :`<rect class="arm" x="24" y="44" width="12" height="4" fill="${skin}"/>`;
 const idleExtra=a.state==='idle'?`<rect x="38" y="50" width="6" height="6" fill="#fff"/><rect x="44" y="52" width="2" height="3" fill="#fff"/><rect x="40" y="46" width="1" height="3" fill="#ccc" opacity=".6"/>`:'';
 const doneBadge=a.state==='done'?`<rect x="40" y="26" width="14" height="14" fill="#b48cff"/><path d="M43 33l3 3 6-6" stroke="#0a0f1e" stroke-width="2" fill="none"/>`:'';
 return `<svg viewBox="0 0 64 80" width="64" height="80" shape-rendering="crispEdges" aria-hidden="true">
  <rect x="6" y="40" width="4" height="30" fill="#33407a"/><rect x="6" y="56" width="20" height="4" fill="#33407a"/>
  <rect x="16" y="54" width="14" height="6" fill="#2b3a6b"/><rect x="26" y="58" width="4" height="10" fill="#2b3a6b"/>
  <rect x="12" y="38" width="14" height="18" fill="${p.shirt}"/>${acc}
  <g class="head"><rect x="12" y="24" width="14" height="14" fill="${skin}"/><rect x="12" y="22" width="14" height="5" fill="${p.hair}"/>${eyes}</g>
  ${arm}
  <rect x="26" y="60" width="34" height="5" fill="#7a5230"/><rect x="28" y="65" width="4" height="15" fill="#5b3c22"/><rect x="54" y="65" width="4" height="15" fill="#5b3c22"/>
  <rect x="36" y="42" width="22" height="16" fill="#151a2e"/><rect class="screen" x="38" y="44" width="18" height="12" fill="${screen}"/><rect x="45" y="58" width="4" height="2" fill="#333"/>
  ${idleExtra}${doneBadge}
 </svg>`;
}
function bubbleText(a,compact){
 switch(a.state){
  case 'working':return `${ICON[a.tool]||'⚙️'} <b>${esc(a.tool)}</b> <code>${esc(a.task)}</code>`;
  case 'thinking':return compact?'💭 thinking…':`💭 ${esc(a.task)}…`;
  case 'waiting':return compact?`✋ <b>${esc(a.tool)}</b> · approve?`:`✋ <b>${esc(a.tool)}</b> <code>${esc(a.task)}</code><br><b>needs your approval</b> · ${agoSpan(a.since)}`;
  case 'idle':return `☕ idle ${compact?'':'for '}${agoSpan(a.since)}`;
  case 'done':return compact?'✅ done':`✅ ${esc(a.task)}`;
 }
}
function workerHTML(s,a,big){
 const key=s.id+':'+a.id;
 return `<div class="worker ${a.state} ${a.type==='lead'?'lead':''} ${selAgent===key?'sel':''}" data-a="${key}" title="${esc(a.name)} · ${TYPE_LABEL[a.type]||esc(a.type)}" onclick="event.stopPropagation();selectAgent('${s.id}','${a.id}')">
  <div class="bubble"><span class="bt">${bubbleText(a,!big)}</span></div>
  ${a.state==='idle'?'<span class="zz">z<i>z</i><b>z</b></span>':''}
  ${sprite(a)}<div class="nm">${esc(a.name)}</div></div>`;
}
function floorHTML(s,big){
 return `<div class="floor ${s.status} ${big?'big':''}" data-sid="${s.id}">
  <div class="tag"><span class="num">FLOOR ${s.num} · PID ${s.pid}</span><span class="name">${esc(s.name)}</span>
   <span class="meta" title="${esc(s.cwd)}">${esc(s.cwd)} · ${esc(s.branch)}</span>
   <span class="pill ${s.status}">${STATUS_LABEL[s.status]}</span>
   <span class="meta">${s.agents.length} agent${s.agents.length>1?'s':''} · up ${agoSpan(s.startedAt)} · ctx ${s.ctx}%</span></div>
  <div class="room"><div class="workers">${s.agents.map(a=>workerHTML(s,a,big)).join('')}</div></div></div>`;
}
function agentCard(s,a){
 const key=s.id+':'+a.id;
 return `<div class="acard ${a.state} ${selAgent===key?'sel':''}" data-a="${key}" onclick="selectAgent('${s.id}','${a.id}')">
  <div class="h"><span>${esc(a.name)}</span><span class="st">● ${STATE_LABEL[a.state]}</span></div>
  <div class="task">${bubbleText(a)}</div>
  <div class="sub"><span>${TYPE_LABEL[a.type]||esc(a.type)}</span><span>since ${hhmm(a.since)}</span></div></div>`;
}

/* ===================== scene ===================== */
const FH=172,ROOF=57;
function moveCab(i){const cab=$('cab');if(!cab)return;const n=SESSIONS.length;cab.style.top=(i>=n?ROOF+n*FH+2:ROOF+i*FH+FH-66)+'px'}
function restCab(){const w=SESSIONS.findIndex(s=>s.status==='waiting');moveCab(w>=0?w:SESSIONS.length)}
function renderScene(){
 const sc=$('scene');
 if(view==='all'){
  sc.innerHTML=`<div class="moon"></div><div class="building" style="--fh:${FH}px">
   <div class="shaft"><div class="cab" id="cab" style="top:${ROOF+SESSIONS.length*FH+2}px"></div></div>
   <div class="tower">
    <div class="roof"><div class="sign">CLAUDE &amp; CO.</div><div class="antenna"></div></div>
    ${SESSIONS.map(s=>floorHTML(s,false)).join('')}
    <div class="lobby"><div class="door"></div><span>🛎️ Lobby</span><span>Registry: <b>${SESSIONS.length}</b> sessions checked in</span><span><b>${agentCount()}</b> agents on the clock</span><span class="small" style="margin-left:auto">~/.claude/sessions/*.json</span></div>
   </div></div><div class="ground"></div>`;
  requestAnimationFrame(restCab);
  sc.querySelectorAll('.floor').forEach((f,i)=>{
   f.addEventListener('mouseenter',()=>moveCab(i));
   f.addEventListener('mouseleave',restCab);
   f.addEventListener('click',()=>setView(f.dataset.sid));
  });
 }else{
  const s=byId(view);
  sc.innerHTML=`<div class="focus">
   <div class="crumbs"><button class="btn" onclick="setView('all')">← Whole building</button><span>Floor ${s.num} · ${esc(s.name)}</span><span class="small" style="margin-left:auto">click a worker to filter the activity feed</span></div>
   <div class="tower solo">${floorHTML(s,true)}</div>
   <div class="agents">${s.agents.map(a=>agentCard(s,a)).join('')}</div></div>`;
 }
}

/* ===================== side panel ===================== */
function evHTML(e){return `<div class="ev ${e.who==='you'?'you':''}"><span class="t">${hhmm(e.t)}</span><span>${e.who==='you'?'🧑‍💻':(ICON[e.tool]||'•')}</span><span><span class="w">${esc(e.who)}</span> ${e.tool?`<b>${esc(e.tool)}</b> <code>${esc(e.text)}</code>`:esc(e.text)}</span></div>`}
function allPanel(){
 const w=waitingList();
 return `
 <div class="card attn"><h3>✋ Needs your attention</h3>${w.length?w.map(([s,a])=>`<div class="row"><span class="dot waiting"></span><div class="grow"><div><b>${esc(s.name)}</b> · ${esc(a.name)}</div><div class="muted">${esc(a.tool)} <code style="font-size:11px">${esc(a.task)}</code> · ${agoSpan(a.since)} ago</div></div><button class="btn" onclick="setView('${s.id}')">Floor ${s.num}</button></div>`).join(''):'<div class="muted">Nothing is waiting on you.</div>'}</div>
 <div class="card"><h3>🏢 Directory</h3>${SESSIONS.map(s=>`<div class="row click" onclick="setView('${s.id}')"><span class="dot ${s.status}"></span><div class="grow"><div><b>${esc(s.name)}</b> <span class="muted">· floor ${s.num}</span></div><div class="muted">${s.agents.length} agent${s.agents.length>1?'s':''} · ${s.agents.filter(a=>a.state==='working'||a.state==='thinking').length} active · up ${agoSpan(s.startedAt)}</div></div><div class="mini"><div class="bar ${s.ctx>50?'hot':''}"><i style="width:${s.ctx}%"></i></div><div class="muted small">ctx ${s.ctx}%</div></div></div>`).join('')}</div>
 <div class="card"><h3>Legend</h3><div class="legend">
  <span><i class="dot" style="background:var(--work)"></i>working · running a tool</span><span><i class="dot" style="background:var(--think)"></i>thinking · composing</span>
  <span><i class="dot" style="background:var(--wait)"></i>needs your approval</span><span><i class="dot" style="background:var(--idle)"></i>idle · waiting for you</span>
  <span><i class="dot" style="background:var(--done)"></i>finished subagent</span><span>🔍📖💻✏️ = Grep Read Bash Edit</span></div></div>
 <div class="card"><h3>Where the real data comes from</h3><ul class="src">
  <li>Floors: <code>~/.claude/sessions/&lt;pid&gt;.json</code> (name, cwd, busy/idle)</li>
  <li>Workers: session transcript <code>.jsonl</code> + its <code>subagents/</code> folder</li>
  <li>Speech bubbles: latest <code>tool_use</code> block in each transcript</li>
  <li>Raised hand: <code>PermissionRequest</code> hook</li></ul></div>`;
}
function sessionPanel(s){
 const a=selAgent?s.agents.find(x=>s.id+':'+x.id===selAgent):null;
 const feed=(a?s.feed.filter(e=>e.who===a.name||e.who==='you'):s.feed).slice(0,18);
 return `
 <div class="card"><h3><span class="dot ${s.status}"></span>${esc(s.name)} <span class="muted small">floor ${s.num}</span></h3>
  <dl class="kv"><dt>Status</dt><dd>${STATUS_LABEL[s.status]}</dd><dt>Directory</dt><dd title="${esc(s.cwd)}">${esc(s.cwd)}</dd><dt>Branch</dt><dd>${esc(s.branch)}</dd><dt>PID</dt><dd>${s.pid}</dd><dt>Uptime</dt><dd>${agoSpan(s.startedAt)}</dd><dt>Model</dt><dd>${esc(s.model)}</dd><dt>Turns</dt><dd>${s.turns}</dd><dt>Tokens</dt><dd>${fmtTok(s.tokIn)} in · ${fmtTok(s.tokOut)} out</dd></dl>
  <div class="bar ${s.ctx>50?'hot':''}" style="margin-top:10px"><i style="width:${s.ctx}%"></i></div><div class="muted small" style="margin-top:4px">Context window ${s.ctx}% used</div></div>
 <div class="card"><h3>📌 Current assignment</h3><p class="prompt">“${esc(s.prompt)}”</p></div>
 <div class="card"><h3>👥 Crew (${s.agents.length})</h3>${s.agents.map(x=>`<div class="row click ${selAgent===s.id+':'+x.id?'on':''}" onclick="selectAgent('${s.id}','${x.id}')"><span class="dot" style="background:var(--${cssState(x.state)})"></span><div class="grow"><b>${esc(x.name)}</b> <span class="muted">· ${TYPE_LABEL[x.type]||esc(x.type)}</span><div class="muted">${STATE_LABEL[x.state]}${x.tool?' · '+esc(x.tool):''} · ${agoSpan(x.since)}</div></div></div>`).join('')}</div>
 <div class="card"><h3>🕒 Activity ${a?`<span class="muted small">· ${esc(a.name)} only</span><button class="btn" style="margin-left:auto" onclick="selectAgent(null)">show all</button>`:''}</h3><div class="feed">${feed.map(evHTML).join('')}</div></div>`;
}
function renderPanel(){$('panel').innerHTML=view==='all'?allPanel():sessionPanel(byId(view))}

/* ===================== chrome ===================== */
function renderViews(){
 $('views').innerHTML=`<button data-v="all" class="${view==='all'?'on':''}">🏢 Whole building</button>`+
  SESSIONS.map(s=>`<button data-v="${s.id}" class="${view===s.id?'on':''}"><span class="dot ${s.status}"></span>${esc(s.name)}<small>${s.agents.length}</small></button>`).join('');
 $('views').querySelectorAll('button').forEach(b=>b.onclick=()=>setView(b.dataset.v));
}
function renderStats(){
 $('st-sessions').innerHTML=`<b>${SESSIONS.length}</b> sessions`;
 $('st-agents').innerHTML=`<b>${agentCount()}</b> agents`;
 const w=waitingList().length;$('st-wait').innerHTML=w?`<b>${w}</b> need${w>1?'':'s'} approval`:'';
}
function render(){renderViews();renderStats();renderScene();renderPanel()}
function setView(v){view=v;selAgent=null;history.replaceState(null,'','#'+v);render()}
function selectAgent(sid,aid){
 const key=sid?sid+':'+aid:null;selAgent=(selAgent===key)?null:key;
 if(view==='all'&&sid){view=sid;render();return}
 document.querySelectorAll('.worker,.acard').forEach(el=>el.classList.toggle('sel',el.dataset.a===selAgent));
 renderPanel();
}
function refreshAgent(s,a){
 document.querySelectorAll(`.worker[data-a="${s.id}:${a.id}"]`).forEach(el=>el.outerHTML=workerHTML(s,a,!!el.closest('.floor.big')));
 document.querySelectorAll(`.acard[data-a="${s.id}:${a.id}"]`).forEach(el=>el.outerHTML=agentCard(s,a));
 if(view===s.id)renderPanel();
}
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'||e.key==='0')return setView('all');
 const s=SESSIONS.find(x=>String(x.num)===e.key);if(s)setView(s.id);
});

/* ===================== fake liveness ===================== */
setInterval(()=>{
 $('clock').textContent=new Date().toLocaleTimeString([],{hour12:false});
 document.querySelectorAll('[data-ago]').forEach(el=>el.textContent=ago(+el.dataset.ago));
},1000);
setInterval(()=>{
 const pool=[];SESSIONS.forEach(s=>s.agents.forEach(a=>{if(a.state==='working'&&ROTATE[a.type])pool.push([s,a])}));
 if(!pool.length)return;
 const [s,a]=pool[Math.floor(Math.random()*pool.length)];
 const opts=ROTATE[a.type].filter(o=>o.task!==a.task);const o=opts[Math.floor(Math.random()*opts.length)];
 a.tool=o.tool;a.task=o.task;a.since=Date.now();
 s.feed.unshift({t:Date.now(),who:a.name,tool:o.tool,text:o.task});
 refreshAgent(s,a);
},3600);
setInterval(()=>{
 const s=byId('ws'),a=s.agents[0];
 if(a.state==='thinking'){a.state='working';a.tool='Write';a.task='mockups/a-office-building.html'}
 else{a.state='thinking';a.tool=null;a.task='Reviewing what the subagents found'}
 a.since=Date.now();s.feed.unshift({t:Date.now(),who:a.name,tool:a.tool,text:a.task});
 refreshAgent(s,a);
},9000);

render();
</script>
</body>
</html>
